[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchledger"
version = "0.1.0.dev1"
description = "Capture research experiments and connect their code, evidence, and decisions."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Prabhjeet Singh"}]
dependencies = []

[project.scripts]
researchledger = "researchledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
